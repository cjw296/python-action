name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-check-typing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
        uv-params: ["--group extras --dev", "--dev"]
    steps:
      - uses: actions/checkout@v4

      - uses: ./check-typing/
        with:
          python-version: ${{ matrix.python-version }}
          uv-params: ${{ matrix.uv-params }}
          project-directory: tests/sample-python-project

  test-run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
        uv-params: ["--group extras --dev", "--dev"]
    steps:
      - uses: actions/checkout@v4

      - uses: ./run-tests/
        id: run-tests
        with:
          python-version: ${{ matrix.python-version }}
          uv-params: ${{ matrix.uv-params }}
          project-directory: tests/sample-python-project

      - name: Verify coverage file was created
        run: |
          ls -la tests/sample-python-project/.coverage.*
          echo "Coverage files found successfully"

  test-check-coverage:
    runs-on: ubuntu-latest
    needs: test-run-tests
    steps:
      - uses: actions/checkout@v4

      - uses: ./check-coverage/
        with:
          project-directory: tests/sample-python-project

  test-carthorse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./carthorse/
        with:
          check: 'true'
          tag-format: 'test-{version}'
          project-directory: tests/sample-python-project

  test-check-formatting:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: ./check-formatting/
        with:
          project-directory: tests/sample-python-project

  build-sample-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hynek/build-and-inspect-python-package@v2
        with:
          path: tests/sample-python-project

  test-check-distributions:
    needs: build-sample-package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: ./check-distributions/
        with:
          package: test_package
          python-version: ${{ matrix.python-version }}
          typed: 'true'

  test-check-distributions-with-extras:
    needs: build-sample-package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: ./check-distributions/
        with:
          package: test_package
          python-version: ${{ matrix.python-version }}
          typed: 'true'
          extras: '[test-extra]'

  test-uv-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./uv-run/
        with:
          python-version: "3.12"
          uv-params: "--resolution lowest-direct"
          command: "python -c 'import requests; assert requests.__version__ == \\\"2.25.0\\\"'"
          project-directory: tests/minimal-python-project

      - uses: ./uv-run/
        with:
          python-version: "3.12"
          command: "python -c 'import requests; assert requests.__version__ == \\\"2.31.0\\\"'"
          project-directory: tests/minimal-python-project

      - uses: ./uv-run/
        with:
          python-version: "3.12"
          prefix: "TEST_ENV_VAR=test_value"
          command: "python -c 'import os; assert os.environ.get(\\\"TEST_ENV_VAR\\\") == \\\"test_value\\\"'"
          project-directory: tests/minimal-python-project

      - uses: ./uv-run/
        with:
          python-version: "3.12"
          prefix: "cd ../sample-python-project && uv lock &&"
          command: "python -c 'import os; assert os.path.basename(os.getcwd()) == \\\"sample-python-project\\\"'"
          project-directory: tests/minimal-python-project

  all-green:
    if: always()
    needs:
      - test-check-typing
      - test-check-coverage
      - test-carthorse
      - test-check-formatting
      - test-check-distributions
      - test-check-distributions-with-extras
      - test-uv-run
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
