name: 'Setup UV and Run Command'

inputs:
  python-version:
    description: 'Python version to use'
    required: true
  uv-params:
    description: 'Params for uv'
    default: "--all-extras --dev"
  command:
    description: 'Command arguments after uv run'
    required: true
  prefix:
    description: 'Command prefix for environment variables. Use __SLUG__ placeholder for cache suffix.'
    default: ""
  project-directory:
    description: 'Directory containing pyproject.toml (useful for monorepos)'
    default: "."

outputs:
  slug:
    description: 'Slugified uv-params for cache keys'
    value: ${{ steps.suffix.outputs.slug }}

runs:
  using: composite
  steps:
      - uses: cjw296/slugify-action@v1
        id: suffix
        with:
          value: "${{ inputs.python-version }}-${{ inputs.uv-params }}"

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache-dependency-glob: "**/pyproject.toml"
          cache-suffix: ${{ steps.suffix.outputs.slug }}
          working-directory: ${{ inputs.project-directory }}

      - name: Setup environment
        shell: bash
        run: cd "${{ inputs.project-directory }}" && uv sync ${{ inputs.uv-params }}

      - name: Versions used
        shell: bash
        run: cd "${{ inputs.project-directory }}" && uv tree --frozen

      - name: Run command
        shell: bash
        run: |
          CMD="${{ inputs.prefix }} uv run --frozen ${{ inputs.command }}"
          CMD="${CMD//__SLUG__/${{ steps.suffix.outputs.slug }}}"
          cd "${{ inputs.project-directory }}"
          echo "Running: $CMD"
          eval "$CMD"
